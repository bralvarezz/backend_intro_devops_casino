apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidal-casino-backend
  labels:
    app: vidal-casino-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vidal-casino-backend
  template:
    metadata:
      labels:
        app: vidal-casino-backend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: vidal-casino-backend

      containers:
        - name: vidal-casino-backend
          image: 631932931672.dkr.ecr.us-east-1.amazonaws.com/vidal-casino-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "db-service"  
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: casino-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: casino-config
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: casino-config
                  key: DB_NAME
            - name: READY_MAX_MEM_PERCENT
              value: "90.0"            
            - name: APUESTAS_N_EVENTOS
              value: "10"
            - name: JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: casino-config
                  key: JWT_SECRET 
            - name: CORS_ORIGIN
              value: "*"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP                    
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: vidal-casino-backend